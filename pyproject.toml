[project]
name = "hackbot"
version = "0.1.0"
description = "bugbug — a local, modular, auditable, safety-controlled bug bounty research workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD (see docs/licenses-and-attribution.md)" }
authors = [{ name = "operator" }]
dependencies = [
    "typer>=0.12",          # CLI framework
    "rich>=13.7",           # terminal UX
    "pyyaml>=6.0",          # config / manifests
    "httpx>=0.27",          # provider gateway + conservative retrieval
    "pydantic>=2.7",        # schema validation (program/scope/findings)
    "keyring>=25.0",        # native OS keychain / SecretService (argv-safe secrets)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hackbot = "hackbot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts allowed in tests

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

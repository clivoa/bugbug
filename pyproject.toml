[project]
name = "hackbot"
version = "0.1.0"
description = "bugbug — a local, modular, auditable, safety-controlled bug bounty research workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD (see docs/licenses-and-attribution.md)" }
authors = [{ name = "operator" }]

# Core CLI (doctor / scope / secrets orchestration / version) is stdlib-only, so
# it installs and runs with no third-party runtime deps. Feature areas pull their
# libraries via extras below; later phases (gateway, reporting) add their own.
dependencies = []

[project.optional-dependencies]
# Production secrets storage in the OS keychain. Without this extra the CLI still
# runs; `hackbot secrets` degrades gracefully with guidance (no traceback).
secrets = ["keyring>=25.0"]
# YAML config / manifest generation (used by the recon-bundle tooling).
config = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hackbot = "hackbot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts allowed in tests

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

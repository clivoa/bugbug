[project]
name = "hackbot"
version = "0.1.0"
description = "bugbug — a local, modular, auditable, safety-controlled bug bounty research workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Caio" }]

# Core CLI (doctor / scope / secrets orchestration / version) is stdlib-only, so
# it installs and runs with no third-party runtime deps. Feature areas pull their
# libraries via extras below; later phases (gateway, reporting) add their own.
dependencies = []

[project.optional-dependencies]
# Production secrets storage in the OS keychain. Without this extra the CLI still
# runs; `hackbot secrets` degrades gracefully with guidance (no traceback).
secrets = ["keyring>=25.0"]
# YAML config / manifest generation (used by the recon-bundle tooling).
config = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hackbot = "hackbot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Historical review evidence is retained byte-for-byte; Ruff would otherwise
# rewrite fenced examples inside the preserved Markdown reports.
extend-exclude = ["docs/reviews/engagement-v2-p0"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # asserts are allowed (tests, and internal invariants)
    "S105",  # false positive: flags secret NAME constants, not secret values
    "S603",  # subprocess is used only with fixed argv arrays (never shell strings)
    "S607",  # diagnostic tools are invoked by name via PATH (doctor.py)
    "UP042", # str+Enum is intentional (stable JSON serialization of ScopeKind)
    "S110",  # try/except/pass is intentional in best-effort cleanup paths
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # tests may use subprocess/tmp freely
# data-heavy files: long policy-note / markdown-table string literals
"src/hackbot/skills/bundle_classify.py" = ["E501"]
"scripts/generate_recon_bundle.py" = ["E501", "E402"]
"scripts/generate_recon_docs.py" = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
